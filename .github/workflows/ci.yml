name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package.json declares engines.node >= 22, so CI runs the floor it claims
      # rather than whatever the developer happens to have installed.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same four gates CLAUDE.md requires before any phase closes.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
